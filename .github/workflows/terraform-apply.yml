
name: provision-mysql-queimadas

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    env:
      TF_IN_AUTOMATION: "true"

      # Senha do MySQL
      TF_VAR_mysql_admin_password: ${{ secrets.MYSQL_ADMIN_PASSWORD }}

      # Credenciais do Terraform na Azure
      ARM_CLIENT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientId }}
      ARM_CLIENT_SECRET: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientSecret }}
      ARM_TENANT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).tenantId }}
      ARM_SUBSCRIPTION_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).subscriptionId }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Export Terraform outputs
        run: |
          echo "MYSQL_FQDN=$(terraform output -raw mysql_fqdn)" >> "$GITHUB_ENV"
          echo "MYSQL_DB=$(terraform output -raw database_name)" >> "$GITHUB_ENV"
          echo "MYSQL_ADMIN=$(terraform output -raw mysql_admin_username)" >> "$GITHUB_ENV"
          echo "MYSQL_SERVER=$(terraform output -raw mysql_server_name)" >> "$GITHUB_ENV"
          echo "RESOURCE_GROUP=$(terraform output -raw resource_group_name)" >> "$GITHUB_ENV"

      - name: Resumo da infraestrutura
        run: |
          echo "## MySQL - Checkpoint FIAP" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Resource Group: $(terraform output -raw resource_group_name)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "MySQL Server: $(terraform output -raw mysql_server_name)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "MySQL FQDN: $(terraform output -raw mysql_fqdn)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Database: $(terraform output -raw database_name)" >> "$GITHUB_STEP_SUMMARY"
